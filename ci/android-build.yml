name: Android CI — build APK & AAB

# Поклади цей файл у .github/workflows/android-build.yml
# Після кожного push у main/develop GitHub Actions збере APK,
# який можна скачати з вкладки Actions -> Artifacts.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Що збирати"
        required: true
        default: "both"
        type: choice
        options: [debug, release, both]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Умовні кроки не можуть звертатися до `secrets` напряму в `if:` —
# тому наявність ключа рахуємо в окремому кроці й прокидаємо через outputs.

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  # --------------------------------------------------------------------------
  # 0. Перевіряємо, що датасет на місці і валідний — до того, як палити хвилини
  #    на Gradle-збірку.
  # --------------------------------------------------------------------------
  dataset-check:
    name: Validate word bank asset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check assets/gurtom.db.gz
        run: |
          set -euo pipefail
          DB="app/src/main/assets/gurtom.db.gz"
          if [ ! -f "$DB" ]; then
            echo "::error::Не знайдено $DB — покладіть датасет у assets перед збіркою."
            exit 1
          fi
          SIZE=$(stat -c%s "$DB")
          echo "gurtom.db.gz size: $SIZE bytes"
          if [ "$SIZE" -lt 500000 ]; then
            echo "::error::Файл підозріло малий ($SIZE байт) — схоже на пошкоджений датасет."
            exit 1
          fi
          gunzip -c "$DB" > /tmp/gurtom.db
          python3 - <<'PY'
          import sqlite3, sys
          con = sqlite3.connect("/tmp/gurtom.db")
          words = con.execute("SELECT COUNT(*) FROM words").fetchone()[0]
          party = con.execute("SELECT COUNT(*) FROM party").fetchone()[0]
          easy  = con.execute("SELECT COUNT(*) FROM words WHERE difficulty=1 AND age=6").fetchone()[0]
          act   = con.execute("SELECT COUNT(*) FROM words WHERE actable=1").fetchone()[0]
          print(f"words={words} party={party} easy6+={easy} actable={act}")
          if words < 20000: sys.exit(f"::error::Надто мало слів: {words}")
          if party < 100:   sys.exit(f"::error::Надто мало карток: {party}")
          if easy  < 500:   sys.exit(f"::error::Надто мало легких слів: {easy}")
          if act   < 500:   sys.exit(f"::error::Надто мало показуваних слів: {act}")
          # жодне слово не повинно бути порожнім чи сміттєвим
          bad = con.execute(
              "SELECT COUNT(*) FROM words WHERE length(trim(w)) < 2 OR w GLOB '*[{}|=<>*]*'"
          ).fetchone()[0]
          if bad: sys.exit(f"::error::Знайдено {bad} сміттєвих записів у words")
          print("DATASET OK")
          PY

  # --------------------------------------------------------------------------
  # 1. Лінт + юніт-тести
  # --------------------------------------------------------------------------
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    needs: dataset-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint & test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-lint-tests
          path: |
            **/build/reports/lint-results-debug.html
            **/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  # --------------------------------------------------------------------------
  # 2. Debug APK — твій основний шлях «зібрав і поставив на телефон»
  # --------------------------------------------------------------------------
  apk-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'both' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Report APK size
        run: |
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gurtom-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # --------------------------------------------------------------------------
  # 3. Release AAB/APK — для Google Play. Підписується, якщо додані секрети.
  # --------------------------------------------------------------------------
  apk-release:
    name: Build release AAB + APK
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'release' || inputs.build_type == 'both' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # --- Секрети, які треба додати в Settings -> Secrets and variables -> Actions:
      #   KEYSTORE_BASE64  = base64 -w0 gurtom.jks
      #   KEY_ALIAS        = gurtom
      #   KEY_PASSWORD     = <пароль ключа>
      #   STORE_PASSWORD   = <пароль сховища>
      - name: Detect keystore secret
        id: keystore-check
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore keystore (if secrets present)
        if: steps.keystore-check.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.gradle
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.gradle/gurtom.jks
          echo "Keystore restored."

      - name: Write signing properties (if secrets present)
        if: steps.keystore-check.outputs.present == 'true' 
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=${HOME}/.gradle/gurtom.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF
          echo "keystore.properties written (not committed)."

      - name: Bundle release
        run: ./gradlew bundleRelease --stacktrace

      - name: Assemble release APK (sideload)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gurtom-release-${{ github.sha }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 60

      - name: Cleanup keystore
        if: always()
        run: rm -f ~/.gradle/gurtom.jks keystore.properties

  # --------------------------------------------------------------------------
  # 4. Створюємо GitHub Release із підписаним APK (тільки для тегів v*)
  # --------------------------------------------------------------------------
  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: apk-release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gurtom-*
          merge-multiple: true
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
