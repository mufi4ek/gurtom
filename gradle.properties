# Глобальні налаштування Gradle-Daemon для проєкту Ґуртом.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
org.gradle.workers.max=1

# Версії для конвенційного плагіна buildSrc (синхронізовано з gradle/libs.versions.toml)
gurtom.composeBom=2026.01.00
gurtom.coreKtx=1.17.0
gurtom.composeUi=1.10.3
gurtom.material3=1.4.0
